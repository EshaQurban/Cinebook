<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snacks Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    background-image: url(/images/snacks\ background\ imange.png);
    }

    .container {
      background-color: #2c2c2c;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 800px;
    }

    h2 {
      margin-bottom: 25px;
    }

    .snacks-row {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }

    .snack-card {
      background-color: #3a3a3a;
      border-radius: 10px;
      padding: 15px;
      width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .snack-card img {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .item-name {
      margin-bottom: 10px;
      font-weight: bold;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-control button {
      background-color: #28a745;
      border: none;
      color: white;
      font-size: 18px;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .summary {
      margin-top: 30px;
    }

    .summary h3 {
      margin-bottom: 10px;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      width: 100px;
      margin-left: 300px;
      
    }

    .buttons button {
      padding: 10px 20px;
      border: none;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .confirm {
      background-color: #28a745;
      color: white;
      flex: 1;
       
    }
     .skip {
      background-color: #2593e1;
      color: rgb(255, 247, 247);
      flex: 1;
      text-decoration: none;
       
    }

    .reset {
      background-color: #dc3545;
      color: white;
      flex: 1;
    }

    @media (max-width: 600px) {
      .snacks-row {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Snacks</h2>

  <div class="snacks-row">
    <div class="snack-card">
      <img src="/images/salad.png" alt="Salad">
      <div class="item-name">Salad - 500Rs</div>
      <div class="quantity-control">
        <button onclick="updateQty('salad', -1)">-</button>
        <span id="saladQty">0</span>
        <button onclick="updateQty('salad', 1)">+</button>
      </div>
    </div>

    <div class="snack-card">
      <img src="/images/burger.png" alt="Burger">
      <div class="item-name">Burger - 650Rs</div>
      <div class="quantity-control">
        <button onclick="updateQty('burger', -1)">-</button>
        <span id="burgerQty">0</span>
        <button onclick="updateQty('burger', 1)">+</button>
      </div>
    </div>

    <div class="snack-card">
      <img src="/images/fries.png" alt="Fries">
      <div class="item-name">Fries - 250Rs</div>
      <div class="quantity-control">
        <button onclick="updateQty('fries', -1)">-</button>
        <span id="friesQty">0</span>
        <button onclick="updateQty('fries', 1)">+</button>
      </div>
    </div>
  </div>

  <div class="summary">
    <h3>Booking Summary</h3>
    <p id="total">Tickets: 0Rs</p>
  </div>

  <div class="buttons">
    <button class="confirm">Confirm Payment</button>
    <button class="reset" onclick="resetAll()">Reset</button>
    <button class="skip"><a href="/images.html/final_ticket_display.html">Skip</a></button>
  </div>
</div>

<script>
  let prices = {
    salad: 500,
    burger: 650,
    fries: 250
  };

  let quantities = {
    salad: 0,
    burger: 0,
    fries: 0
  };



  function updateQty(item, change) {
    quantities[item] += change;
    if (quantities[item] < 0) quantities[item] = 0;
    document.getElementById(item + "Qty").textContent = quantities[item];
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    for (let item in quantities) {
      total += quantities[item] * prices[item];
    }
    document.getElementById("total").textContent = "Tickets: " + total + "Rs";
    return total;
  }

  function resetAll() {
    for (let item in quantities) {
      quantities[item] = 0;
      document.getElementById(item + "Qty").textContent = 0;
    }
    updateTotal();
  }

  document.querySelector(".confirm").addEventListener("click", function() {
    const totalAmount = updateTotal();
    if (totalAmount > 0) {
      alert("Payment confirmed! You have ordered snacks worth " + totalAmount + "Rs.");
    } else {
      alert("Please select at least one snack before confirming.");
    }
  });
   
</script>

</body>
</html>

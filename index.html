<script>
(function(){
 const loggedIn = localStorage.getItem('cinebookLoggedIn') === 'true';
 const login=document.getElementById('navLogin'), signup=document.getElementById('navSignup'), logout=document.getElementById('navLogout');
 if(loggedIn){ if(login) login.style.display='none'; if(signup) signup.style.display='none'; if(logout) logout.style.display='inline-block'; }

})();

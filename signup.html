<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cine book - Sign Up</title>
<style>
body{margin:0;padding:0;font-family:Arial,sans-serif}.background-image{position:fixed;inset:0;width:100%;height:100%;background-image:url("images/signup.jpg");background-repeat:no-repeat;background-size:cover;background-position:center;z-index:-1}.sign-up-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:350px;padding:18px 10px;background:#000;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.5)}.sign-up-container h1{color:#ff0000;text-align:center;margin:10px 0 20px;font-weight:bold}.sign-up-container input{box-sizing:border-box;width:60%;height:40px;background:#333;color:#fff;border:0;text-align:center;margin:0 20% 14px;border-radius:5px}.sign-up-button{background:rgb(102,9,9);color:#fff;cursor:pointer;border:0;border-radius:5px;padding:10px 14px;display:block;margin:4px auto 0}.account-link{color:#fff;text-align:center;font-size:14px;margin:16px 0 4px}.account-link a{color:#4889f1;text-decoration:none}.account-link a:hover{text-decoration:underline}.message{display:none;text-align:center;color:#fff;font-size:13px;margin-top:10px}.message.error{color:#ff7777}.message.success{color:#90ee90}@media(max-width:480px){.sign-up-container{width:calc(100% - 40px);box-sizing:border-box}.sign-up-container input{width:85%;margin-left:7.5%;margin-right:7.5%}}
</style>
</head>
<body>
<div class="background-image"></div>
<div class="sign-up-container">
<form id="signupForm">
<h1>Cine book</h1>
<input id="firstName" type="text" placeholder="First name" required>
<input id="lastName" type="text" placeholder="Last name" required>
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password" required>
<input id="confirmPassword" type="password" placeholder="Confirm Password" required>
<button type="submit" class="sign-up-button">Create Account</button>
<p class="account-link">Already have an account? <a href="login.html">Login</a></p>
<p id="message" class="message"></p>
</form></div>
<script>
document.getElementById('signupForm').addEventListener('submit',function(e){
 e.preventDefault(); const msg=document.getElementById('message');
 const email=document.getElementById('email').value.trim().toLowerCase();
 const password=document.getElementById('password').value; const confirm=document.getElementById('confirmPassword').value;
 msg.className='message'; msg.style.display='block';
 if(password!==confirm){msg.textContent='Passwords do not match.';msg.classList.add('error');return;}
 const user={firstName:document.getElementById('firstName').value.trim(),lastName:document.getElementById('lastName').value.trim(),email,password};
 localStorage.setItem('cinebookUser',JSON.stringify(user));
 msg.textContent='Account created successfully. Please login.'; msg.classList.add('success');
 setTimeout(()=>location.href='login.html',700);
});
</script>
</body></html>
